spring.application.name=conduit-test
conduit.security.jwt-secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
conduit.security.jwt-issuer=conduit-test
conduit.security.bootstrap-admin-email=admin@conduit.test
conduit.security.bootstrap-admin-password=ConduitTestAdmin2026!
conduit.security.refresh-cookie-secure=false
conduit.security.allowed-origins=http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173

spring.datasource.url=jdbc:postgresql://localhost:5432/conduit_tests
spring.datasource.username=${CONDUIT_DB_USERNAME:postgres}
spring.datasource.password=${CONDUIT_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Integration tests exercise listener services directly; do not require an
# external Kafka broker merely to start a Spring test context.
spring.kafka.listener.auto-startup=false
conduit.scheduling.enabled=false
# This test profile checks that the actuator routes are exposed; Redis
# readiness is covered separately and must not make the route smoke test fail.
management.health.redis.enabled=false
