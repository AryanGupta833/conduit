spring.application.name=conduit
conduit.security.jwt-secret=${CONDUIT_JWT_SECRET:}
conduit.security.jwt-issuer=${CONDUIT_JWT_ISSUER:conduit}
conduit.security.access-token-minutes=${CONDUIT_ACCESS_TOKEN_MINUTES:10}
conduit.security.refresh-token-days=${CONDUIT_REFRESH_TOKEN_DAYS:14}
conduit.security.refresh-cookie-secure=${CONDUIT_REFRESH_COOKIE_SECURE:true}
conduit.security.allowed-origins=${CONDUIT_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173}
conduit.security.bootstrap-admin-email=${CONDUIT_BOOTSTRAP_ADMIN_EMAIL:}
conduit.security.bootstrap-admin-password=${CONDUIT_BOOTSTRAP_ADMIN_PASSWORD:}
conduit.security.metrics-token=${CONDUIT_METRICS_TOKEN:}
conduit.security.mfa-encryption-key=${CONDUIT_MFA_ENCRYPTION_KEY:}
conduit.credentials.encryption-key=${CONDUIT_CREDENTIALS_ENCRYPTION_KEY:}
spring.datasource.url=${CONDUIT_DB_URL:jdbc:postgresql://localhost:5432/conduit}
spring.datasource.username=${CONDUIT_DB_USERNAME:postgres}
spring.datasource.password=${CONDUIT_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
conduit.execution-context.max-bytes=${CONDUIT_EXECUTION_CONTEXT_MAX_BYTES:1048576}
conduit.execution-context.max-task-result-bytes=${CONDUIT_EXECUTION_CONTEXT_MAX_TASK_RESULT_BYTES:262144}
conduit.execution.max-concurrent-per-account=${CONDUIT_MAX_CONCURRENT_EXECUTIONS_PER_ACCOUNT:100}
conduit.execution.deadline-scan-ms=${CONDUIT_EXECUTION_DEADLINE_SCAN_MS:5000}
spring.jpa.show-sql=${CONDUIT_JPA_SHOW_SQL:false}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-none}] %logger{40} - %msg%n

server.port=8080
conduit.workspace.root=${CONDUIT_WORKSPACE_ROOT:${java.io.tmpdir}/conduit-workspaces}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
conduit.worker.recovery.idle-timeout-ms=30000
conduit.worker.recovery.batch-size=10

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=conduit-workflow-triggers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.aryan.conduit.trigger
spring.kafka.consumer.properties.spring.json.value.default.type=com.aryan.conduit.trigger.WorkflowTriggerEvent
