name: Bug report
description: Report a reproducible bug in Conduit.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        Please provide enough detail to reproduce the problem.

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What is going wrong?
      placeholder: Describe the issue clearly.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the bug.
      placeholder: |
        1. Create a workflow...
        2. Execute it...
        3. Observe the error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Conduit version
      placeholder: e.g. commit SHA or release version
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Remove passwords, tokens, and other secrets before posting.
      render: text
    validations:
      required: false